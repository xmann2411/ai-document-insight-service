services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Default backend is the free local model - no key needed.
      QA_BACKEND: ${QA_BACKEND:-local}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-embedding}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      # Only needed when QA_BACKEND=claude:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
    volumes:
      - model-cache:/models

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  model-cache:
